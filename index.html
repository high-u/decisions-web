<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Decisions Web</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // light or dark before the page is drawn: the user's choice once made, the OS setting until then.
    // A choice that cannot be read is told by main.js, from data-theme-read-error.
    (() => {
      let saved = null;
      try { saved = localStorage.getItem('decision-web:theme'); } catch (error) { document.documentElement.dataset.themeReadError = error.message; }
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body class="bg-surface font-body text-on-surface dark:bg-surface-dark dark:text-on-surface-dark">
  <div x-data="app" x-cloak class="flex min-h-svh flex-col">
  <div class="relative flex w-full flex-1 flex-col md:flex-row">
    <!-- Penguin UI: Simple sidebar -->
    <a class="sr-only" href="#main-content">skip to the main content</a>

    <!-- dark overlay for when the sidebar is open on smaller screens -->
    <div x-cloak x-show="showSidebar" class="fixed inset-0 z-10 bg-surface-dark/10 backdrop-blur-xs md:hidden" aria-hidden="true" x-on:click="showSidebar = false" x-transition.opacity></div>

    <nav class="fixed left-0 top-0 z-20 flex h-svh w-60 shrink-0 flex-col border-r border-outline bg-surface-alt p-4 transition-transform duration-300 md:static md:h-auto md:w-64 md:translate-x-0 dark:border-outline-dark dark:bg-surface-dark-alt" x-bind:class="showSidebar ? 'translate-x-0' : '-translate-x-60'" :aria-label="t('sidebar')">
      <div class="flex min-h-0 flex-1 flex-col md:sticky md:top-4 md:flex-none">
      <div class="ml-2 w-fit text-2xl font-bold text-on-surface-strong dark:text-on-surface-dark-strong">Decisions Web</div>

      <div class="mt-4 flex flex-col gap-2 overflow-y-auto pb-6">
        <div class="px-2 pt-2 text-xs font-semibold text-on-surface/70 dark:text-on-surface-dark/70" x-text="t('model')"></div>
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden disabled:cursor-not-allowed disabled:opacity-50 dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-on:click="openDownload()">
          <span class="icon" x-html="$icons.download"></span><span x-text="t('download')"></span>
        </button>
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden disabled:cursor-not-allowed disabled:opacity-50 dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-on:click="deleteModel()" :disabled="!canDeleteModel()">
          <span class="icon" x-html="$icons.trash"></span><span x-text="t('delete')"></span>
        </button>

        <div class="mt-3 border-t border-outline px-2 pt-3 text-xs font-semibold text-on-surface/70 dark:border-outline-dark dark:text-on-surface-dark/70" x-text="t('operations')"></div>
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-on:click="newTab()">
          <span class="icon" x-html="$icons.newFile"></span><span x-text="t('new')"></span>
        </button>
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-on:click="open()">
          <span class="icon" x-html="$icons.open"></span><span x-text="t('open')"></span>
        </button>
        <input type="file" accept="application/json,.json" multiple hidden x-ref="fileInput" x-on:change="openInput($event)">
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden disabled:cursor-not-allowed disabled:opacity-50 dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-on:click="save()" :disabled="!active">
          <span class="icon" x-html="$icons.save"></span><span x-text="t('save')"></span>
        </button>
        <template x-if="$const.canWriteFiles">
          <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden disabled:cursor-not-allowed disabled:opacity-50 dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
            x-on:click="saveAs()" :disabled="!active">
            <span class="icon" x-html="$icons.saveAs"></span><span x-text="t('saveAs')"></span>
          </button>
        </template>

        <div class="mt-3 border-t border-outline px-2 pt-3 text-xs font-semibold text-on-surface/70 dark:border-outline-dark dark:text-on-surface-dark/70" x-text="t('samples')"></div>
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-on:click="samplesOpen = true">
          <span class="icon" x-html="$icons.sample"></span><span x-text="t('open')"></span>
        </button>

        <div class="mt-3 border-t border-outline px-2 pt-3 text-xs font-semibold text-on-surface/70 dark:border-outline-dark dark:text-on-surface-dark/70" x-text="t('language')"></div>
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-show="$store.i18n.lang === 'en'" x-on:click="setLang('ja')">
          <span class="icon" x-html="$icons.language"></span><span>Japanese</span>
        </button>
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-show="$store.i18n.lang === 'ja'" x-on:click="setLang('en')">
          <span class="icon" x-html="$icons.language"></span><span>English</span>
        </button>

        <div class="mt-3 border-t border-outline px-2 pt-3 text-xs font-semibold text-on-surface/70 dark:border-outline-dark dark:text-on-surface-dark/70" x-text="t('mode')"></div>
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-show="dark" x-on:click="setDark(false)">
          <span class="icon" x-html="$icons.sun"></span><span x-text="t('light')"></span>
        </button>
        <button type="button" class="flex items-center rounded-radius gap-2 px-2 py-1.5 text-left text-sm font-medium text-on-surface underline-offset-2 hover:bg-primary/5 hover:text-on-surface-strong focus-visible:underline focus:outline-hidden dark:text-on-surface-dark dark:hover:bg-primary-dark/5 dark:hover:text-on-surface-dark-strong"
          x-show="!dark" x-on:click="setDark(true)">
          <span class="icon" x-html="$icons.moon"></span><span x-text="t('dark')"></span>
        </button>
      </div>
      </div>
    </nav>

    <!-- main content -->
    <div id="main-content" class="flex w-full min-w-0 flex-1 flex-col bg-surface pt-4 dark:bg-surface-dark">
      <!-- Penguin UI: Default tabs, with a close button and the unsaved mark -->
      <div x-show="tabs.length" x-on:keydown.right.prevent="$focus.wrap().next()" x-on:keydown.left.prevent="$focus.wrap().previous()" class="flex shrink-0 gap-2 overflow-x-auto border-b border-outline dark:border-outline-dark" role="tablist">
        <template x-for="tab in tabs" :key="tab.id">
          <div class="flex items-center" x-bind:class="tab.id === activeId ? 'font-bold text-primary border-b-2 border-primary dark:border-primary-dark dark:text-primary-dark' : 'text-on-surface font-medium dark:text-on-surface-dark dark:hover:border-b-outline-dark-strong dark:hover:text-on-surface-dark-strong hover:border-b-2 hover:border-b-outline-strong hover:text-on-surface-strong'">
            <button type="button" role="tab" class="h-min whitespace-nowrap px-4 py-2 text-sm" x-on:click="showTab(tab)" x-bind:aria-selected="tab.id === activeId" x-bind:tabindex="tab.id === activeId ? '0' : '-1'">
              <span x-show="isDirty(tab)" :title="t('unsaved')" :aria-label="t('unsaved')">● </span><span x-text="tab.name"></span>
            </button>
            <button type="button" class="icon rounded-radius p-1 hover:opacity-75" :title="t('closeTab')" :aria-label="t('closeTab')" x-on:click="requestClose(tab)" x-html="$icons.close"></button>
          </div>
        </template>
      </div>

      <div class="w-full flex-1 p-4">

        <template x-for="tab in tabs" :key="tab.id">
          <div x-show="tab.id === activeId" role="tabpanel" class="flex flex-col gap-6 lg:flex-row lg:items-start">
            <div class="flex w-full max-w-xl flex-col gap-6">
              <!-- questions -->
              <section class="flex flex-col gap-3">
                <h2 class="font-semibold text-on-surface-strong dark:text-on-surface-dark-strong" x-text="t('questions')"></h2>
                <template x-for="(q, qi) in tab.form.questions" :key="rowKey(q)">
                  <div class="flex flex-col gap-2 rounded-radius border border-outline p-4 dark:border-outline-dark">
                    <div class="flex justify-end">
                      <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap rounded-radius bg-surface-alt border border-surface-alt dark:border-surface-dark-alt px-4 py-2 text-sm font-medium tracking-wide text-on-surface-strong transition hover:opacity-75 text-center focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-surface-alt active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-surface-dark-alt dark:text-on-surface-dark-strong dark:focus-visible:outline-surface-dark-alt" x-on:click="tab.form.questions.splice(qi, 1)">
                        <span class="icon" x-html="$icons.close"></span><span x-text="t('question.delete')"></span>
                      </button>
                    </div>
                    <div class="grid grid-cols-[minmax(0,1fr)_minmax(0,2fr)_3.375rem] gap-2 items-end">
                      <div class="flex flex-col gap-1">
                        <label class="w-fit pl-0.5 text-sm" x-text="t('id')"></label>
                        <input type="text" x-model="q.id" x-bind:class="error(q.errors?.id) && '!border-danger'" class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark">
                      </div>
                      <!-- Penguin UI: Default select -->
                      <div class="relative col-span-2 flex flex-col gap-1">
                        <label class="w-fit pl-0.5 text-sm" x-text="t('type')"></label>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="absolute pointer-events-none right-4 top-8 size-5">
                          <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                        </svg>
                        <select x-on:change="setType(q, $event.target.value)" class="w-full appearance-none rounded-radius border border-outline bg-surface-alt px-4 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark">
                          <template x-for="type in $const.TYPES" :key="type">
                            <option :value="type" :selected="type === q.type" x-text="t(`type.${type}`)"></option>
                          </template>
                        </select>
                      </div>
                    </div>
                    <small x-show="error(q.errors?.id)" class="pl-0.5 text-danger" x-text="error(q.errors?.id)"></small>

                    <label class="w-fit pl-0.5 text-sm" x-text="t('instructions')"></label>
                    <div class="grid grid-cols-1">
                      <input type="text" x-model="q.instructions" x-bind:class="error(q.errors?.instructions) && '!border-danger'" class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark">
                    </div>
                    <small x-show="error(q.errors?.instructions)" class="pl-0.5 text-danger" x-text="error(q.errors?.instructions)"></small>

                    <!-- criteria: choice -->
                    <template x-if="q.type === 'choice'">
                      <div class="flex flex-col gap-2">
                        <label class="w-fit pl-0.5 text-sm" x-text="t('criteria.choice')"></label>
                        <template x-for="(row, i) in q.criteria" :key="rowKey(row)">
                          <div class="flex flex-col gap-1">
                            <div class="grid grid-cols-[minmax(0,1fr)_minmax(0,2fr)_3.375rem] gap-2 items-center">
                              <input type="text" x-model="row.key" :placeholder="t('choice.key')" x-bind:class="error(row.errors?.key) && '!border-danger'" class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark">
                              <input type="text" x-model="row.description" :placeholder="t('choice.desc')" x-bind:class="i < 2 && 'col-span-2'" class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark">
                              <button type="button" class="icon inline-flex justify-center items-center gap-2 whitespace-nowrap rounded-radius bg-surface-alt border border-surface-alt dark:border-surface-dark-alt px-4 py-2 text-sm font-medium tracking-wide text-on-surface-strong transition hover:opacity-75 text-center focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-surface-alt active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-surface-dark-alt dark:text-on-surface-dark-strong dark:focus-visible:outline-surface-dark-alt" x-show="i >= 2" :title="t('remove')" :aria-label="t('remove')" x-on:click="q.criteria.splice(i, 1)" x-html="$icons.close"></button>
                            </div>
                            <small x-show="error(row.errors?.key)" class="pl-0.5 text-danger" x-text="error(row.errors?.key)"></small>
                          </div>
                        </template>
                        <small x-show="error(q.errors?.criteria)" class="pl-0.5 text-danger" x-text="error(q.errors?.criteria)"></small>
                        <div class="flex justify-end">
                          <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap bg-transparent rounded-radius border border-primary px-4 py-2 text-sm font-medium tracking-wide text-primary transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:border-primary-dark dark:text-primary-dark dark:focus-visible:outline-primary-dark" x-on:click="q.criteria.push({ key: '', description: '' })" :disabled="!$fn.canAddCriterion(q)">
                            <span class="icon" x-html="$icons.newFile"></span><span x-text="t('choice.add')"></span>
                          </button>
                        </div>
                      </div>
                    </template>

                    <!-- criteria: score -->
                    <template x-if="q.type === 'score'">
                      <div class="flex flex-col gap-2">
                        <label class="w-fit pl-0.5 text-sm" x-text="t('criteria.score')"></label>
                        <template x-for="(_, i) in q.criteria" :key="i">
                          <div class="grid grid-cols-[minmax(0,1fr)_minmax(0,2fr)_3.375rem] gap-2 items-center">
                            <input type="text" x-model="q.criteria[i]" :placeholder="t('score.desc')" x-bind:class="i < 2 ? 'col-span-3' : 'col-span-2'" class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark">
                            <button type="button" class="icon inline-flex justify-center items-center gap-2 whitespace-nowrap rounded-radius bg-surface-alt border border-surface-alt dark:border-surface-dark-alt px-4 py-2 text-sm font-medium tracking-wide text-on-surface-strong transition hover:opacity-75 text-center focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-surface-alt active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-surface-dark-alt dark:text-on-surface-dark-strong dark:focus-visible:outline-surface-dark-alt" x-show="i >= 2" :title="t('remove')" :aria-label="t('remove')" x-on:click="q.criteria.splice(i, 1)" x-html="$icons.close"></button>
                          </div>
                        </template>
                        <small x-show="error(q.errors?.criteria)" class="pl-0.5 text-danger" x-text="error(q.errors?.criteria)"></small>
                        <div class="flex justify-end">
                          <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap bg-transparent rounded-radius border border-primary px-4 py-2 text-sm font-medium tracking-wide text-primary transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:border-primary-dark dark:text-primary-dark dark:focus-visible:outline-primary-dark" x-on:click="q.criteria.push('')" :disabled="!$fn.canAddCriterion(q)">
                            <span class="icon" x-html="$icons.newFile"></span><span x-text="t('score.add')"></span>
                          </button>
                        </div>
                      </div>
                    </template>

                    <!-- criteria: noul -->
                    <template x-if="q.type === 'noul'">
                      <div class="flex flex-col gap-2">
                        <label class="w-fit pl-0.5 text-sm" x-text="t('criteria.noul')"></label>
                        <template x-for="key in ['true', 'false']" :key="key">
                          <div class="grid grid-cols-[3rem_minmax(0,1fr)] gap-2 items-center">
                            <span class="pl-0.5 text-sm" x-text="key"></span>
                            <input type="text" x-model="q.criteria[key]" :placeholder="t('noul.desc')" class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark">
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <small x-show="error(tab.form.errors?.questions)" class="pl-0.5 text-danger" x-text="error(tab.form.errors?.questions)"></small>
                <div class="flex justify-end">
                  <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap bg-transparent rounded-radius border border-primary px-4 py-2 text-sm font-medium tracking-wide text-primary transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:border-primary-dark dark:text-primary-dark dark:focus-visible:outline-primary-dark" x-on:click="addQuestion(tab)">
                    <span class="icon" x-html="$icons.newFile"></span><span x-text="t('question.add')"></span>
                  </button>
                </div>
              </section>
            </div>
            <div class="flex w-full max-w-xl flex-col gap-3">
              <!-- state -->
              <section class="flex flex-col gap-3">
                <h2 class="font-semibold text-on-surface-strong dark:text-on-surface-dark-strong" x-text="t('state')"></h2>
                <div class="flex flex-col gap-2 rounded-radius border border-outline p-4 dark:border-outline-dark">
                  <!-- Penguin UI: Default radio -->
                  <div class="flex gap-4">
                    <div class="flex items-center justify-start gap-2 font-medium text-on-surface dark:text-on-surface-dark">
                      <input :id="`text-${tab.id}`" type="radio" :name="`mode-${tab.id}`" :checked="typeof tab.form.state === 'string'" x-on:change="setStateMode(tab, true)" class="before:content[''] relative h-4 w-4 appearance-none rounded-full border border-outline bg-surface-alt before:invisible before:absolute before:left-1/2 before:top-1/2 before:h-1.5 before:w-1.5 before:-translate-x-1/2 before:-translate-y-1/2 before:rounded-full before:bg-on-primary checked:border-primary checked:bg-primary checked:before:visible focus:outline-2 focus:outline-offset-2 focus:outline-outline-strong checked:focus:outline-primary disabled:cursor-not-allowed dark:border-outline-dark dark:bg-surface-dark-alt dark:before:bg-on-primary-dark dark:checked:border-primary-dark dark:checked:bg-primary-dark dark:focus:outline-outline-dark-strong dark:checked:focus:outline-primary-dark">
                      <label :for="`text-${tab.id}`" class="text-sm" x-text="t('state.text')"></label>
                    </div>
                    <div class="flex items-center justify-start gap-2 font-medium text-on-surface dark:text-on-surface-dark">
                      <input :id="`items-${tab.id}`" type="radio" :name="`mode-${tab.id}`" :checked="typeof tab.form.state !== 'string'" x-on:change="setStateMode(tab, false)" class="before:content[''] relative h-4 w-4 appearance-none rounded-full border border-outline bg-surface-alt before:invisible before:absolute before:left-1/2 before:top-1/2 before:h-1.5 before:w-1.5 before:-translate-x-1/2 before:-translate-y-1/2 before:rounded-full before:bg-on-primary checked:border-primary checked:bg-primary checked:before:visible focus:outline-2 focus:outline-offset-2 focus:outline-outline-strong checked:focus:outline-primary disabled:cursor-not-allowed dark:border-outline-dark dark:bg-surface-dark-alt dark:before:bg-on-primary-dark dark:checked:border-primary-dark dark:checked:bg-primary-dark dark:focus:outline-outline-dark-strong dark:checked:focus:outline-primary-dark">
                      <label :for="`items-${tab.id}`" class="text-sm" x-text="t('state.items')"></label>
                    </div>
                  </div>
                  <template x-if="typeof tab.form.state === 'string'">
                    <div class="grid grid-cols-1">
                      <textarea x-model="tab.form.state" rows="5" x-bind:class="error(tab.form.errors?.state) && '!border-danger'" class="w-full rounded-radius border border-outline bg-surface-alt px-2.5 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark"></textarea>
                    </div>
                  </template>
                  <template x-if="typeof tab.form.state !== 'string'">
                    <div class="flex flex-col gap-2">
                      <template x-for="(row, i) in tab.form.state" :key="rowKey(row)">
                        <div class="flex flex-col gap-1">
                          <div class="grid grid-cols-[minmax(0,1fr)_minmax(0,2fr)_3.375rem] gap-2 items-start">
                            <input type="text" x-model="row.key" :placeholder="t('state.key')" x-bind:class="error(row.errors?.key) && '!border-danger'" class="w-full rounded-radius border border-outline bg-surface-alt px-2 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark">
                            <textarea x-model="row.value" rows="3" :placeholder="t('state.value')" x-bind:class="i < 1 && 'col-span-2'" class="w-full rounded-radius border border-outline bg-surface-alt px-2.5 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary dark:border-outline-dark dark:bg-surface-dark-alt/50 dark:focus-visible:outline-primary-dark"></textarea>
                            <button type="button" class="icon inline-flex justify-center items-center gap-2 whitespace-nowrap rounded-radius bg-surface-alt border border-surface-alt dark:border-surface-dark-alt px-4 py-2 text-sm font-medium tracking-wide text-on-surface-strong transition hover:opacity-75 text-center focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-surface-alt active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-surface-dark-alt dark:text-on-surface-dark-strong dark:focus-visible:outline-surface-dark-alt" x-show="i >= 1" :title="t('remove')" :aria-label="t('remove')" x-on:click="tab.form.state.splice(i, 1)" x-html="$icons.close"></button>
                          </div>
                          <small x-show="error(row.errors?.key)" class="pl-0.5 text-danger" x-text="error(row.errors?.key)"></small>
                        </div>
                      </template>
                      <div class="flex justify-end">
                        <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap bg-transparent rounded-radius border border-primary px-4 py-2 text-sm font-medium tracking-wide text-primary transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:border-primary-dark dark:text-primary-dark dark:focus-visible:outline-primary-dark" x-on:click="tab.form.state.push({ key: '', value: '' })">
                          <span class="icon" x-html="$icons.newFile"></span><span x-text="t('state.add')"></span>
                        </button>
                      </div>
                    </div>
                  </template>
                  <small x-show="error(tab.form.errors?.state)" class="pl-0.5 text-danger" x-text="error(tab.form.errors?.state)"></small>
                </div>
              </section>

              <!-- run -->
              <section class="flex flex-col gap-3">
                <div class="flex justify-end">
                  <button type="button" class="inline-flex w-full justify-center items-center gap-2 whitespace-nowrap rounded-radius bg-primary border border-primary dark:border-primary-dark px-4 py-2 text-sm font-medium tracking-wide text-on-primary transition hover:opacity-75 text-center focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-primary-dark dark:text-on-primary-dark dark:focus-visible:outline-primary-dark"
                    x-on:click="runTab(tab)" :disabled="!canRun(tab)">
                    <span class="icon" x-html="$icons.run"></span><span x-text="t('run')"></span>
                  </button>
                </div>
                <p x-show="tab.run?.ms != null" class="text-center text-sm" x-text="t('run.time', { ms: tab.run?.ms })"></p>

                <template x-if="tab.run?.response">
                  <div class="flex flex-col gap-3">
                    <template x-for="[id, answer] in Object.entries(tab.run.response.answers)" :key="id">
                      <div class="flex flex-col overflow-hidden rounded-radius border border-outline dark:border-outline-dark">
                        <div class="flex items-center justify-between border-b border-outline p-4 dark:border-outline-dark">
                          <h3 class="font-semibold tracking-wide text-on-surface-strong dark:text-on-surface-dark-strong" x-text="t(`type.${answer.type}`)"></h3>
                        </div>
                        <div class="flex flex-col gap-3 p-4">
                          <h4 x-text="id"></h4>
                          <!-- Penguin UI: Default table -->
                          <div class="overflow-hidden w-full overflow-x-auto rounded-radius border border-outline dark:border-outline-dark">
                            <table class="w-full text-left text-sm text-on-surface dark:text-on-surface-dark">
                              <thead class="border-b border-outline bg-surface-alt text-sm text-on-surface-strong dark:border-outline-dark dark:bg-surface-dark-alt dark:text-on-surface-dark-strong">
                                <tr>
                                    <th scope="col" class="w-1/2 p-4" x-text="t(`result.${answer.type}`)"></th>
                                  <th x-show="answer.type !== 'noul'" scope="col" class="w-1/2 p-4" x-text="t('result.confidence')"></th>
                                </tr>
                              </thead>
                              <tbody class="divide-y divide-outline dark:divide-outline-dark">
                                <tr>
                                    <td class="p-4" x-text="answer.type === 'noul' ? $fn.fmt(answer.noul) : answer.type === 'choice' ? answer.choice : $fn.fmt(answer.score)"></td>
                                  <td x-show="answer.type !== 'noul'" class="p-4" x-text="answer.type !== 'noul' ? $fn.fmt(answer.confidence) : ''"></td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                          <template x-if="answer.type !== 'noul'">
                            <!-- Penguin UI: Default table -->
                            <div class="overflow-hidden w-full overflow-x-auto rounded-radius border border-outline dark:border-outline-dark">
                              <table class="w-full text-left text-sm text-on-surface dark:text-on-surface-dark">
                                <thead class="border-b border-outline bg-surface-alt text-sm text-on-surface-strong dark:border-outline-dark dark:bg-surface-dark-alt dark:text-on-surface-dark-strong">
                                  <tr>
                                    <th scope="col" class="w-1/2 p-4" x-text="t(answer.legend ? 'result.legend' : 'result.key')"></th>
                                    <th scope="col" class="w-1/2 p-4" x-text="t('result.probabilities')"></th>
                                  </tr>
                                </thead>
                                <tbody class="divide-y divide-outline dark:divide-outline-dark">
                                  <template x-for="[key, p] in Object.entries(answer.probabilities)" :key="key">
                                    <tr>
                                      <td class="p-4" x-text="answer.legend ? answer.legend[key] : key"></td>
                                      <td class="p-4" x-text="$fn.fmt(p)"></td>
                                    </tr>
                                  </template>
                                </tbody>
                              </table>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </section>
            </div>
          </div>
        </template>
      </div>

    </div>

    <!-- toggle button for small screen -->
    <button type="button" class="icon fixed right-4 top-4 z-20 rounded-full bg-primary p-4 md:hidden text-on-primary dark:bg-primary-dark dark:text-on-primary-dark" x-on:click="showSidebar = !showSidebar" :aria-label="t('sidebar')" x-html="showSidebar ? $icons.close : $icons.menu"></button>

    <!-- Penguin UI: Default modal, downloading the model -->
    <div x-cloak x-show="downloadOpen" x-transition.opacity.duration.200ms x-trap.inert.noscroll="downloadOpen" x-on:keydown.esc.window="downloadOpen = false" x-on:click.self="downloadOpen = false" class="fixed inset-0 z-30 flex items-end justify-center bg-black/20 p-4 pb-8 backdrop-blur-md sm:items-center lg:p-8" role="dialog" aria-modal="true" aria-labelledby="downloadTitle">
      <div x-show="downloadOpen" x-transition:enter="transition ease-out duration-200 delay-100 motion-reduce:transition-opacity" x-transition:enter-start="opacity-0 scale-50" x-transition:enter-end="opacity-100 scale-100" class="flex w-full max-w-xl flex-col gap-4 overflow-hidden rounded-radius border border-outline bg-surface text-on-surface dark:border-outline-dark dark:bg-surface-dark-alt dark:text-on-surface-dark">
        <div class="flex items-center justify-between border-b border-outline bg-surface-alt/60 p-4 dark:border-outline-dark dark:bg-surface-dark/20">
          <h3 id="downloadTitle" class="font-semibold tracking-wide text-on-surface-strong dark:text-on-surface-dark-strong" x-text="t('download.title')"></h3>
          <button type="button" x-on:click="downloadOpen = false" :aria-label="t('download.close')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" fill="none" stroke-width="1.4" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="flex flex-col gap-2 px-8 py-8 text-sm">
          <p x-text="t(['loading', 'ready', 'loadFailed'].includes($store.model.status) ? 'model.downloaded' : 'download.body')"></p>
          <p x-show="$store.model.newVersion" x-text="t('model.newVersion')"></p>
          <p x-show="modelText()" x-bind:class="$store.model.status.endsWith('Failed') && 'text-danger'" x-text="modelText()"></p>
        </div>
        <div class="flex flex-col-reverse justify-between gap-2 border-t border-outline bg-surface-alt/60 p-4 dark:border-outline-dark dark:bg-surface-dark/20 sm:flex-row sm:items-center md:justify-end">
          <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap bg-transparent rounded-radius border border-primary px-4 py-2 text-sm font-medium tracking-wide text-primary transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:border-primary-dark dark:text-primary-dark dark:focus-visible:outline-primary-dark"
            x-on:click="downloadOpen = false">
            <span class="icon" x-html="$icons.close"></span><span x-text="t('download.close')"></span>
          </button>
          <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap rounded-radius bg-primary border border-primary dark:border-primary-dark px-4 py-2 text-sm font-medium tracking-wide text-on-primary transition hover:opacity-75 text-center focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-primary-dark dark:text-on-primary-dark dark:focus-visible:outline-primary-dark"
            x-on:click="downloadModel()" :disabled="!canDownloadModel()">
            <span class="icon" x-html="$icons.download"></span><span x-text="t('download')"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Penguin UI: Default modal, choosing a sample -->
    <div x-cloak x-show="samplesOpen" x-transition.opacity.duration.200ms x-trap.inert.noscroll="samplesOpen" x-on:keydown.esc.window="samplesOpen = false" x-on:click.self="samplesOpen = false" class="fixed inset-0 z-30 flex items-end justify-center bg-black/20 p-4 pb-8 backdrop-blur-md sm:items-center lg:p-8" role="dialog" aria-modal="true" aria-labelledby="samplesTitle">
      <div x-show="samplesOpen" x-transition:enter="transition ease-out duration-200 delay-100 motion-reduce:transition-opacity" x-transition:enter-start="opacity-0 scale-50" x-transition:enter-end="opacity-100 scale-100" class="flex w-full max-w-xl flex-col gap-4 overflow-hidden rounded-radius border border-outline bg-surface text-on-surface dark:border-outline-dark dark:bg-surface-dark-alt dark:text-on-surface-dark">
        <div class="flex items-center justify-between border-b border-outline bg-surface-alt/60 p-4 dark:border-outline-dark dark:bg-surface-dark/20">
          <h3 id="samplesTitle" class="font-semibold tracking-wide text-on-surface-strong dark:text-on-surface-dark-strong" x-text="t('samples.title')"></h3>
          <button type="button" x-on:click="samplesOpen = false" :aria-label="t('download.close')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" fill="none" stroke-width="1.4" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="px-8 py-8">
          <!-- Penguin UI: Default table, without a header -->
          <div class="overflow-hidden w-full overflow-x-auto rounded-radius border border-outline dark:border-outline-dark">
            <table class="w-full text-left text-sm text-on-surface dark:text-on-surface-dark">
              <tbody class="divide-y divide-outline dark:divide-outline-dark">
                <template x-for="sample in samples" :key="sample.name">
                  <tr>
                    <td class="p-4">
                      <div class="flex items-center gap-2">
                        <span class="icon" x-html="$icons.document"></span>
                        <!-- Penguin UI: Default link -->
                        <a href="#" class="font-medium text-primary underline-offset-2 hover:underline focus:underline focus:outline-hidden dark:text-primary-dark" x-on:click.prevent="openSample(sample)" x-text="sample.name"></a>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
        <div class="flex flex-col-reverse justify-between gap-2 border-t border-outline bg-surface-alt/60 p-4 dark:border-outline-dark dark:bg-surface-dark/20 sm:flex-row sm:items-center md:justify-end">
          <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap bg-transparent rounded-radius border border-primary px-4 py-2 text-sm font-medium tracking-wide text-primary transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:border-primary-dark dark:text-primary-dark dark:focus-visible:outline-primary-dark"
            x-on:click="samplesOpen = false">
            <span class="icon" x-html="$icons.close"></span><span x-text="t('download.close')"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Penguin UI: Default modal, closing a tab with unsaved changes -->
    <div x-cloak x-show="closing" x-transition.opacity.duration.200ms x-trap.inert.noscroll="closing" x-on:keydown.esc.window="closing = null" x-on:click.self="closing = null" class="fixed inset-0 z-30 flex items-end justify-center bg-black/20 p-4 pb-8 backdrop-blur-md sm:items-center lg:p-8" role="dialog" aria-modal="true" aria-labelledby="closeTitle">
      <div x-show="closing" x-transition:enter="transition ease-out duration-200 delay-100 motion-reduce:transition-opacity" x-transition:enter-start="opacity-0 scale-50" x-transition:enter-end="opacity-100 scale-100" class="flex w-full max-w-xl flex-col gap-4 overflow-hidden rounded-radius border border-outline bg-surface text-on-surface dark:border-outline-dark dark:bg-surface-dark-alt dark:text-on-surface-dark">
        <div class="flex items-center justify-between border-b border-outline bg-surface-alt/60 p-4 dark:border-outline-dark dark:bg-surface-dark/20">
          <h3 id="closeTitle" class="font-semibold tracking-wide text-on-surface-strong dark:text-on-surface-dark-strong" x-text="t('close.title')"></h3>
          <button type="button" x-on:click="closing = null" :aria-label="t('download.close')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" fill="none" stroke-width="1.4" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="px-8 py-8">
          <p class="text-sm" x-text="closing ? t('close.body', { name: closing.name }) : ''"></p>
        </div>
        <div class="flex flex-col-reverse justify-between gap-2 border-t border-outline bg-surface-alt/60 p-4 dark:border-outline-dark dark:bg-surface-dark/20 sm:flex-row sm:items-center md:justify-end">
          <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap bg-transparent rounded-radius border border-primary px-4 py-2 text-sm font-medium tracking-wide text-primary transition hover:opacity-75 text-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:border-primary-dark dark:text-primary-dark dark:focus-visible:outline-primary-dark"
            x-on:click="closing = null">
            <span class="icon" x-html="$icons.close"></span><span x-text="t('close.cancel')"></span>
          </button>
          <button type="button" class="inline-flex justify-center items-center gap-2 whitespace-nowrap rounded-radius bg-primary border border-primary dark:border-primary-dark px-4 py-2 text-sm font-medium tracking-wide text-on-primary transition hover:opacity-75 text-center focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-100 active:outline-offset-0 disabled:opacity-75 disabled:cursor-not-allowed dark:bg-primary-dark dark:text-on-primary-dark dark:focus-visible:outline-primary-dark"
            x-on:click="close(closing)">
            <span class="icon" x-html="$icons.trash"></span><span x-text="t('close.confirm')"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Penguin UI: Stacking toast notification (danger only).
         Errors stay until the user closes them, or until closeWhen() becomes true for one that resolves itself. -->
    <div x-data="toasts" x-on:notify.window="add($event.detail)">

      <div class="group pointer-events-none fixed inset-x-8 top-0 z-99 flex max-w-full flex-col gap-2 bg-transparent px-6 py-6 md:bottom-0 md:left-[unset] md:right-0 md:top-[unset] md:max-w-sm">
        <template x-for="(notification, index) in notifications" x-bind:key="notification.id">
          <div>
            <template x-if="notification.variant === 'danger'">
              <div x-data="{ isVisible: false }" x-cloak x-show="isVisible" class="pointer-events-auto relative rounded-radius border border-danger bg-surface text-on-surface dark:bg-surface-dark dark:text-on-surface-dark" role="alert" x-init="$nextTick(() => { isVisible = true })" x-effect="if (isVisible && notification.closeWhen?.()) { isVisible = false; remove(notification.id) }" x-transition:enter="transition duration-300 ease-out" x-transition:enter-end="translate-y-0" x-transition:enter-start="translate-y-8" x-transition:leave="transition duration-300 ease-in" x-transition:leave-end="-translate-x-24 opacity-0 md:translate-x-24" x-transition:leave-start="translate-x-0 opacity-100">
                <div class="flex w-full items-center gap-2.5 bg-danger/10 rounded-radius p-4 transition-all duration-300">

                  <!-- Icon -->
                  <div class="rounded-full bg-danger/15 p-0.5 text-danger" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5" aria-hidden="true">
                      <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
                    </svg>
                  </div>

                  <!-- Title & Message -->
                  <div class="flex flex-col gap-2">
                    <h3 x-cloak x-show="notification.title" class="text-sm font-semibold text-danger" x-text="notification.title"></h3>
                    <p x-cloak x-show="notification.message" class="text-pretty whitespace-pre-line text-sm" x-text="notification.message"></p>
                  </div>

                  <!--Dismiss Button -->
                  <button type="button" class="ml-auto" :aria-label="t('dismiss')" x-on:click="(isVisible = false), remove(notification.id)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" class="size-5 shrink-0" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>

  <footer class="w-full shrink-0 border-t border-outline bg-surface-alt px-4 py-3 text-xs dark:border-outline-dark dark:bg-surface-dark-alt">
    <ul class="flex flex-wrap gap-x-4 gap-y-1">
      <li class="font-semibold">Credits:</li>
      <li><a class="underline" href="https://huggingface.co/SupersonicLabs/Julia-1">Julia-1</a></li>
      <li><a class="underline" href="https://huggingface.co/SupersonicLabs/Julia-1-ONNX">Julia-1-ONNX</a></li>
      <li><a class="underline" href="https://onnxruntime.ai/">ONNX Runtime Web</a></li>
      <li><a class="underline" href="https://alpinejs.dev/">Alpine.js</a></li>
      <li><a class="underline" href="https://tailwindcss.com/">Tailwind CSS</a></li>
      <li><a class="underline" href="https://www.penguinui.com/">Penguin UI</a></li>
      <li><a class="underline" href="https://heroicons.com/">Heroicons</a></li>
      <li><a class="underline" href="https://www.cloudflare.com/">Cloudflare</a></li>
    </ul>
  </footer>
  </div>
</body>
</html>
